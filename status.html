<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solve 4.0 — Project Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 2rem; text-align: center; border-bottom: 2px solid #e94560; }
header h1 { font-size: 2.5rem; background: linear-gradient(90deg, #e94560, #0f3460); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: #888; font-size: 0.9rem; margin-top: 0.5rem; }
.container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
.category { margin-bottom: 2rem; }
.category h2 { color: #e94560; font-size: 1.3rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #222; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1rem; transition: border-color 0.2s; }
.card:hover { border-color: #e94560; }
.card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
.card .url { font-size: 0.75rem; color: #666; margin-bottom: 0.5rem; word-break: break-all; }
.card .status { font-size: 0.8rem; }
.status-ok { color: #4ade80; }
.status-warn { color: #facc15; }
.status-dead { color: #ef4444; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat-box { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1rem; text-align: center; }
.stat-box .num { font-size: 2rem; font-weight: bold; color: #e94560; }
.stat-box .label { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }
footer { text-align: center; padding: 2rem; color: #444; font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <h1>⛓️ Solve 4.0</h1>
  <p>Autonomous Infrastructure · Content Pipeline · Sales Agents</p>
  <p style="margin-top:0.3rem; color:#666; font-size:0.8rem">Last generated: <span id="timestamp"></span> UTC</p>
</header>
<div class="container">
  <div class="stats" id="stats"></div>
  <div class="category" id="projects"></div>
  <div class="category" id="domains"></div>
</div>
<footer>Solve 4.0 — Replaces Saul, 1, 2, and 3. No inherited patterns.</footer>
<script>
const ts = new Date().toISOString().replace('T',' ').substring(0,19);
document.getElementById('timestamp').textContent = ts;

const stats = [
  { num: '38', label: 'Articles Produced' },
  { num: '3,184', label: 'HTML Pages' },
  { num: '95%', label: 'Agent Coverage' },
  { num: '1,049', label: 'Sitemap URLs' },
  { num: '8', label: 'Active Trade Runners' },
  { num: '14', label: 'Active Projects' },
  { num: '5', label: 'Service Ports' },
  { num: '$0', label: 'Revenue (to date)' },
];
const statsEl = document.getElementById('stats');
stats.forEach(s => {
  statsEl.innerHTML += `<div class="stat-box"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`;
});

const projects = [
  { name: 'Fall of the Cabal', url: 'https://fall-of-the-cabal.surge.sh/', status: 'OK' },
  { name: 'Container Homes Canada', url: 'https://container-homes.surge.sh/', status: 'OK' },
  { name: 'Quantum Bots Agency', url: 'https://quantum-bots-agency.surge.sh/', status: 'OK' },
  { name: 'Jeannie Nails', url: 'https://jeannie-nails.surge.sh/', status: 'OK' },
  { name: 'All About MD', url: 'https://all-about-md.surge.sh/', status: 'OK' },
  { name: 'Drug Doctors', url: 'https://drug-doctors.surge.sh/', status: '503 — Surge blocked' },
  { name: 'Fly to Australia', url: 'https://fly-to-australia.surge.sh/', status: 'OK' },
  { name: 'Cable Bags', url: 'https://cable-bags.surge.sh/', status: 'OK' },
  { name: 'The Deal Wizard', url: 'https://the-deal-wizard.surge.sh/', status: 'OK' },
  { name: 'Damascus Knives', url: 'https://damascus-knives.surge.sh/', status: 'OK' },
  { name: 'Quanivo Wellness', url: 'https://quanivo.surge.sh/', status: 'OK' },
  { name: 'RocketBid Affiliate', url: 'https://rocketbid-affiliate.surge.sh/', status: 'OK' },
  { name: 'Saul Referral', url: 'https://saul-referral.surge.sh/', status: 'OK' },
  { name: 'Small Biz Financing', url: 'https://small-biz-financing-canada.surge.sh/', status: 'Not deployed' },
];
const projEl = document.getElementById('projects');
projEl.innerHTML = '<h2>📦 Active Projects</h2><div class="grid"></div>';
const grid = projEl.querySelector('.grid');
projects.forEach(p => {
  grid.innerHTML += `<div class="card"><h3>${p.name}</h3><div class="url"><a href="${p.url}" target="_blank" style="color:#4a9eff">${p.url}</a></div><div class="status ${p.status === 'OK' ? 'status-ok' : 'status-dead'}">${p.status}</div></div>`;
});

const domains = [
  { name: 'cracksup.com', status: 'Dead webhost' },
  { name: 'flytoaustralia.com', status: 'Dead webhost' },
  { name: 'drugdoctors.com', status: 'Dead webhost' },
  { name: 'patentsattorneys.com', status: 'Dead webhost' },
  { name: 'cablebags.com', status: 'Dead webhost' },
  { name: 'thedealwizard.com', status: 'Dead webhost' },
  { name: 'allaboutmd.com', status: 'Dead webhost' },
  { name: 'atvworldwide.com', status: 'Live (WordPress/WooCommerce)' },
];
const domEl = document.getElementById('domains');
domEl.innerHTML = '<h2>🌐 Owned Domains</h2><div class="grid"></div>';
const domGrid = domEl.querySelector('.grid');
domains.forEach(d => {
  domGrid.innerHTML += `<div class="card"><h3>${d.name}</h3><div class="status ${d.status === 'Live (WordPress/WooCommerce)' ? 'status-ok' : 'status-warn'}">${d.status}</div></div>`;
});
</script>
</body>
</html>
