<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fall of the Cabal — NFT Artwork</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a0f;color:#e0e0e0;padding:20px;text-align:center}
h1{color:#ff4444;font-size:32px;margin-bottom:4px;letter-spacing:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:30px auto}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px;transition:transform .2s}
.card:hover{transform:translateY(-4px);border-color:#ff4444}
.card img{width:100%;max-width:250px;border-radius:8px;background:#0a0a14}
.card h3{color:#fff;margin:10px 0 4px}
.card p{color:#888;font-size:12px}
</style>
</head>
<body>
<h1>⚔ FALL OF THE CABAL</h1>
<p style="color:#666">NFT Collection — XRP Ledger</p>
<div class="gallery">
<div class="card"><img src="founder-token.svg"><h3>Founder Token</h3><p>Soulbound · $49.99</p></div>
<div class="card"><img src="intel-normal.svg"><h3>Intel — Normal</h3><p>Common operative</p></div>
<div class="card"><img src="intel-uncommon.svg"><h3>Intel — Uncommon</h3></div>
<div class="card"><img src="intel-rare.svg"><h3>Intel — Rare</h3></div>
<div class="card"><img src="intel-epic.svg"><h3>Intel — Epic</h3></div>
<div class="card"><img src="intel-legendary.svg"><h3>Intel — Legendary</h3></div>
<div class="card"><img src="intel-mystic.svg"><h3>Intel — Mystic</h3></div>
<div class="card"><img src="intel-mythic.svg"><h3>Intel — Mythic</h3></div>
</div>
</body>
</html>
